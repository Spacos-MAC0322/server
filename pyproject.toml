[project]
name = "spacos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pymongo>=4.13,<5",
    "httpx>=0.28,<1",
    "tzdata; sys_platform == 'win32'",
    "pydantic-settings>=2.9,<3",
    "tenacity>=9.2.1,<10",
    "cachetools>=7.2,<8",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "mongomock-motor",
]
lint = [
    "ruff",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.core" = ["mongodb_schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real MongoDB instance"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
